name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: |
          cd site
          npm ci

      - name: Copy assets
        run: |
          cp -r assets site/public/

      - name: Run indexing scripts
        run: |
          cd site
          npx tsx scripts/index_contracts.ts
          npx tsx scripts/index_gpt_functions.ts
          npx tsx scripts/index_terraform.ts

      - name: Fetch repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          npx tsx scripts/fetch_repo_data.ts || echo "Failed to fetch repo data, continuing..."
          npx tsx scripts/fetch_discussions.ts || echo "Failed to fetch discussions, continuing..."
          npx tsx scripts/fetch_projects.ts || echo "Failed to fetch projects, continuing..."

      - name: Copy mermaid diagrams
        run: |
          if [ -d "mermaid" ]; then
            mkdir -p site/public/diagrams
            find mermaid -name "*.mmd" -exec cp {} site/public/diagrams/ \;
            cd site/public/diagrams
            echo '{"diagrams":['$(ls *.mmd 2>/dev/null | sed 's/^/"/;s/$/"/' | paste -sd,)']}'  > manifest.json || echo '{"diagrams":[]}' > manifest.json
          else
            mkdir -p site/public/diagrams
            echo '{"diagrams":[]}' > site/public/diagrams/manifest.json
          fi

      - name: Build Astro site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd site
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
